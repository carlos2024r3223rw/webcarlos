<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tallerfacil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#17171C" />
    </linearGradient>
    <radialGradient id="glow_tallerfacil" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0F0F12" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid_tallerfacil" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23232B" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg_tallerfacil)" />
  <rect width="800" height="450" fill="url(#glow_tallerfacil)" />
  <rect width="800" height="450" fill="url(#grid_tallerfacil)" />
  <rect x="0.5" y="0.5" width="799" height="449" fill="none" stroke="#272730" stroke-width="1" />

  <!-- Accent top line -->
  <line x1="70" y1="55" x2="140" y2="55" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <g transform="translate(70, 85)">
    <rect width="270.5" height="28" rx="6" fill="#1C1C24" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="3.5" fill="#06B6D4" />
    <text x="26" y="18" fill="#E4E4E7" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">PROYECTO PERSONAL · APP MÓVIL</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="210" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="700" letter-spacing="-1">TallerFácil</text>

  <!-- Subtitle line -->
  <text x="70" y="255" fill="#71717A" font-family="'Inter', sans-serif" font-size="16" font-weight="400">Diseño de arquitectura, implementación y despliegue técnico.</text>

