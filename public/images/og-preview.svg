<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <radialGradient id="accentGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222226" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#accentGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#26262E" stroke-width="2" />

  <!-- Badge -->
  <g transform="translate(100, 110)">
    <rect width="320" height="36" rx="8" fill="#181820" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="18" cy="18" r="4.5" fill="#3B82F6" />
    <text x="34" y="23" fill="#60A5FA" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PORTAFOLIO PROFESIONAL</text>
  </g>

  <!-- Title -->
  <text x="100" y="230" fill="#FFFFFF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Carlos | Desarrollador de Software</text>

  <!-- Subtitle -->
  <text x="100" y="295" fill="#A1A1AA" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400">SaaS · Automatización con IA · E-Commerce · Sistemas Backend</text>

  <!-- Tech tags -->
  <g transform="translate(100, 420)">
    <rect x="0" width="140" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="70" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="155" width="120" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="215" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">React</text>

    <rect x="290" width="130" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="355" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node.js</text>

    <rect x="435" width="130" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="500" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Shopify</text>

    <rect x="580" width="120" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="640" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python</text>

    <rect x="715" width="140" height="42" rx="8" fill="#16161D" stroke="#2B2B36" stroke-width="1" />
    <text x="785" y="26" fill="#D4D4D8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Supabase</text>
  </g>

  <!-- URL watermark -->
  <text x="100" y="530" fill="#71717A" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="600">webcarlos.dev</text>
</svg>
